name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import and smoke test (Godot 4.7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install required utilities
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install pinned Godot
        run: bash scripts/setup-godot.sh

      - name: Import Godot project
        run: |
          GODOT=".tools/godot/$(cat .godot-version)/godot"
          "$GODOT" --headless --editor --path game --import --quit

      - name: Smoke test main scene
        run: |
          GODOT=".tools/godot/$(cat .godot-version)/godot"
          "$GODOT" --headless --path game --quit-after 30
